server.port=8081
# ==== H2 in-memory datasource ====
spring.datasource.url=jdbc:h2:mem:examdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# ==== JPA / Hibernate ====
# ddl-auto=update -> Hibernate creates/updates tables from @Entity classes automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# ==== H2 web console (visit http://localhost:8080/h2-console) ====
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console